<style>/* Layout: franja negra con logo; catálogo público y panel privado comparten una columna centrada. Tarjetas negras para cifras, superficies blancas para datos. Un solo tema, negro sobre blanco, por decisión de marca. */
:root{
  color-scheme:light;
  --ink:#0b0b0b; --paper:#ffffff; --mist:#f4f4f2; --line:#e2e2de; --mute:#76766f; --soft:#a9a9a3; --dash:#c4c4bf;
  --display:"Outfit","Helvetica Neue",Arial,sans-serif;
  --body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--mist);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#000;display:flex;justify-content:center;padding:0 16px;overflow:hidden}
header.top a{display:block;line-height:0;border-radius:12px}
header.top img{width:176px;height:176px;display:block;margin:-28px 0 -22px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,40px);font-weight:700;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
header.top :focus-visible{outline-color:var(--paper)}

.tabs{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px;align-self:center}
.tabs a{padding:8px 18px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:600}
.tabs a.on{background:var(--ink);color:var(--paper)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .eyebrow{color:var(--soft)}
.tile .num{font-size:clamp(19px,2.6vw,24px);font-weight:600;overflow-wrap:anywhere}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--mute)}
.status.err{color:var(--ink);font-weight:600}
.note{font-size:13px;color:var(--mute);background:var(--paper);border:1px dashed var(--soft);border-radius:10px;padding:10px 12px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;overflow:hidden}
.field label{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;background:var(--mist);border:1px solid transparent;border-radius:10px;padding:10px 12px;height:42px}
textarea{height:auto;min-height:110px;resize:vertical;line-height:1.5}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;max-height:42px;line-height:20px;overflow:hidden}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:20px;margin:0}
input:hover,select:hover,textarea:hover{border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:var(--paper)}
input.money{text-align:right;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:500}
.onmist input,.onmist select{background:var(--paper);border-color:var(--line)}
.cfg{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,2fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#2a2a2a}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.big{padding:14px 22px;font-size:16px;width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.big svg{width:22px;height:22px}
.btn[disabled]{opacity:.5;cursor:default}
.add{width:100%;border:1.5px dashed var(--soft);background:transparent;color:var(--ink);border-radius:var(--r);padding:14px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;cursor:pointer}
.add:hover{border-color:var(--ink);background:var(--paper)}
.plus{border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.add .plus{width:28px;height:28px}
.add .plus svg{width:16px;height:16px}
.icon{width:36px;height:36px;border:none;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
.icon:hover{background:var(--mist);color:var(--ink)}
.icon svg{width:17px;height:17px}

.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.car{background:var(--paper);border:1.5px dashed var(--dash);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.car:hover{border-color:#9a9a94;transform:translateY(-2px)}
.car.solid{border:1px solid var(--line)}
.car .ph{position:relative;flex:none;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--ink);display:grid;place-items:center;color:#555}
.car .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.car .ph svg{width:56px;height:56px}
.car .ph .tag{position:absolute;left:10px;top:10px;background:var(--paper);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.car .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.car .name{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.15;text-transform:uppercase;overflow-wrap:anywhere}
.car .price{font-family:var(--display);font-weight:700;font-size:20px}
.car dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.car dt{color:var(--mute)} .car dd{margin:0;text-align:right;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);border-radius:999px;padding:3px 10px}
.pill.on{background:var(--ink);color:var(--paper)}
.pill.soft{border-color:var(--line);color:var(--mute)}
.car.new{align-items:center;justify-content:center;gap:12px;min-height:220px;font-weight:600;cursor:pointer;font-size:15px;background:transparent}
.car.new .plus{width:48px;height:48px}
.car.new .plus svg{width:22px;height:22px}

.hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.gal{position:relative;border-radius:var(--r);overflow:hidden;background:var(--ink)}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:center;position:relative;aspect-ratio:4/3}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.gbtn svg{width:18px;height:18px}
.gbtn.prev{left:10px}.gbtn.next{right:10px}
.gcount{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.galtools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.galtools .btn{padding:8px 14px;font-size:14px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.photo{position:relative;display:block;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--mist);border:1.5px dashed var(--soft);cursor:pointer}
.photo .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--mute);font-weight:600;text-align:center;padding:12px}
.photo .empty svg{width:40px;height:40px}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.photo.dark{background:var(--ink);border:none;cursor:default}
.photo.dark .empty{color:#555}

.rows{display:flex;flex-direction:column;gap:8px}
.rowhead,.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) 150px 140px 36px;gap:8px;align-items:center}
.rowhead span:nth-child(4){text-align:right;padding-right:12px}
.row input.con{font-weight:600}
.result{gap:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.line .lbl{font-weight:600;min-width:0}
.line .num{font-size:17px;font-weight:600;white-space:nowrap}
.line input.money{width:170px;flex:none}
.line.final{background:var(--ink);color:var(--paper);border-radius:var(--r);border:none;padding:16px 18px;margin-top:12px}
.line.final .num{font-size:22px}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.empty-state{text-align:center;padding:36px 16px;align-items:center}
.empty-state p{color:var(--mute);max-width:46ch}

.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .knob{width:46px;height:26px;border-radius:999px;background:var(--dash);position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:transform .15s}
.switch input:checked+.knob{background:var(--ink)}
.switch input:checked+.knob::after{transform:translateX(20px)}
.switch input:focus-visible+.knob{outline:2px solid var(--ink);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:500;cursor:pointer;background:var(--paper);position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.chip.static{cursor:default}

.price-xl{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1}
.specs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 24px;margin:0}
.specs div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.specs dt{color:var(--mute)} .specs dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.obs{white-space:pre-wrap;max-width:70ch}
.cta{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cta .btn{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.cta .btn:hover{background:#e9e9e6}
.cta p{color:var(--soft)}
.intro{display:flex;flex-direction:column;gap:6px}
.searchbar{display:flex;gap:10px;align-items:center}
.searchbar input{background:var(--paper);border-color:var(--line);height:46px;border-radius:999px;padding:0 18px}
footer.foot{text-align:center;color:var(--mute);font-size:13px;padding-top:8px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cfg{grid-template-columns:1fr 1fr}
  .cfg .field:last-child{grid-column:1/-1}
  .specs{grid-template-columns:1fr}
  .rowhead{display:none}
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;grid-template-areas:"con con del" "det det det" "fec mon mon";background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}
  .row .con{grid-area:con}.row .det{grid-area:det}.row .fec{grid-area:fec}.row .mon{grid-area:mon}.row .icon{grid-area:del}
  .panel.flat{background:transparent;border:none;padding:0}
  header.top img{width:144px;height:144px;margin:-22px 0 -18px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles.five .tile:first-child{grid-column:1/-1}
  .line input.money{width:140px}
}
@media (min-width:761px) and (max-width:980px){.specs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.car,.switch .knob,.switch .knob::after{transition:none}}

.login{max-width:420px;width:100%;align-self:center}
.loginform{display:flex;flex-direction:column;gap:12px}
footer.foot a{color:inherit}
</style>
</head>

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
function rid(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function num(v){if(typeof v==="number")return isFinite(v)?v:0;var n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0}
function has(v){return String(v==null?"":v).replace(/[^0-9]/g,"")!==""}
function money(n){var a=Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});return(n<0?"-$":"$")+a}
function miles(v){return num(v).toLocaleString("en-US",{maximumFractionDigits:0})}
function pct(){var p=num(S.cfg.pct);return Math.min(100,Math.max(0,p))}
function calc(v){
  var inv=0;(v.gastos||[]).forEach(function(g){inv+=num(g.monto)});
  var sold=has(v.venta),venta=sold?num(v.venta):0,gan=sold?venta-inv:0,socio=gan*pct()/100;
  return{inv:inv,sold:sold,venta:venta,gan:gan,socio:socio,mio:gan-socio};
}
function title(v){var t=[v.marca,v.modelo,v.anio].filter(function(x){return x&&String(x).trim()}).join(" ");return t||"Vehículo nuevo"}
function list(){return Object.keys(S.veh).map(function(id){var v=S.veh[id];v.id=id;return v}).sort(function(a,b){return(a.creado||0)-(b.creado||0)})}
function fotosOf(id){var v=S.veh[id];return((v&&v.fotos)||[]).map(function(u,i){return{id:i,data:u}})}
function pub(v){if(!v.pub)v.pub={on:false,moneda:"US$",unidad:"Mi",acc:[]};if(!v.pub.acc)v.pub.acc=[];return v.pub}
function precio(a){return has(a.precio)?(a.moneda||"US$")+" "+miles(a.precio):"Precio a consultar"}
function waNum(){var d=String((admin?S.cfg.whatsapp:CAT.whatsapp)||CAT.whatsapp||"").replace(/\D/g,"");if(d.length===10)d="1"+d;return d}
function waLink(a){var n=waNum();if(!n)return"";var t=a?"Hola, me interesa el "+title(a)+(has(a.precio)?" ("+precio(a)+")":"")+" que vi en el catálogo de TheFlow Capital.":"Hola, vi el catálogo de TheFlow Capital y quiero más información.";return"https://wa.me/"+n+"?text="+encodeURIComponent(t)}
function catAuto(id){for(var i=0;i<CAT.autos.length;i++)if(CAT.autos[i].id===id)return CAT.autos[i];return null}
function route(){
  var h=(location.hash||"").slice(1);
  if(admin&&h==="panel")return{v:"panel"};
  if(admin&&h.indexOf("v-")===0&&S.veh[h])return{v:"veh",id:h};
  if(h==="entrar"&&!admin)return{v:"entrar"};
  if(h.indexOf("c-")===0&&catAuto(h.slice(2)))return{v:"auto",id:h.slice(2)};
  return{v:"cat"};
}

/* ---------- servidor ---------- */
function api(r,opt){
  return fetch("/api?r="+r,Object.assign({credentials:"same-origin"},opt||{})).then(function(res){
    return res.json().catch(function(){return{}}).then(function(j){if(!res.ok){var e=new Error(j.error||"servidor");e.status=res.status;e.code=j.error;throw e}return j});
  });
}
function post(r,body){return api(r,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}
function failMsg(e){return e&&e.status===401?"Tu sesión venció. Recarga la página y vuelve a entrar.":e&&e.code==="config"?"Falta conectar la base de datos en Vercel.":"No se pudo guardar. Revisa tu conexión y vuelve a editar."}
function setStatus(m,err){statusMsg=m;statusErr=!!err;var e=document.getElementById("status");if(e){e.textContent=m;e.className="status"+(err?" err":"")}}
function save(id){
  dirty[id]=true;ver[id]=(ver[id]||0)+1;setStatus("Guardando…");
  clearTimeout(timers[id]);timers[id]=setTimeout(function(){flush(id)},650);
}
function flush(id){
  clearTimeout(timers[id]);
  var v=ver[id],data=id==="_cfg"?clone(S.cfg):S.veh[id]?clone(S.veh[id]):null;
  if(!data)return;delete data.id;
  chain[id]=(chain[id]||Promise.resolve()).then(function(){return post("save",{id:id==="_cfg"?"cfg":id,data:data})}).then(function(){
    if(ver[id]===v){dirty[id]=false;setStatus("Guardado")}
  }).catch(function(e){setStatus(failMsg(e),true)});
}
function flushAll(){Object.keys(dirty).forEach(function(id){if(dirty[id])flush(id)});return Promise.all(Object.keys(chain).map(function(k){return chain[k]}))}
function removeVeh(id){
  delete S.veh[id];clearTimeout(timers[id]);dirty[id]=false;
  (chain[id]||Promise.resolve()).then(function(){return post("borrar",{id:id})}).catch(function(){setStatus("No se pudo eliminar. Recarga la página e inténtalo otra vez.",true)});
}
function loadCat(){return api("catalogo").then(function(c){CAT=c;catState="ok"},function(){catState="error"})}

function sel(id,label,opts,val,blank){return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'">'+(blank?'<option value="">—</option>':'')+opts.map(function(o){return'<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select></div>'}
function tile(label,out,val){return '<div class="tile"><span class="eyebrow">'+label+'</span><span class="num" data-out="'+out+'">'+val+'</span></div>'}
function tabs(on){return admin?'<nav class="tabs" aria-label="Secciones"><a href="#panel"'+(on==="panel"?' class="on" aria-current="page"':'')+'>Panel privado</a><a href="#inicio"'+(on==="cat"?' class="on" aria-current="page"':'')+'>Catálogo público</a></nav>':""}
function statusEl(){return '<span id="status" class="status'+(statusErr?" err":"")+'" role="status">'+esc(statusMsg)+'</span>'}
function gallery(srcs,alt){
  if(!srcs.length)return"";
  var h='<div class="gal"><div class="track" id="track" tabindex="0" aria-label="Fotos del vehículo">'+srcs.map(function(s,i){return'<div class="slide"><img src="'+esc(s)+'" alt="'+esc(alt)+", foto "+(i+1)+'"'+(i?' loading="lazy"':'')+'></div>'}).join("")+'</div>';
  if(srcs.length>1)h+='<button class="gbtn prev" data-act="gprev" aria-label="Foto anterior">'+I.back+'</button><button class="gbtn next" data-act="gnext" aria-label="Foto siguiente">'+I.fwd+'</button><span class="gcount" id="gcount">1 / '+srcs.length+'</span>';
  return h+'</div>';
}
function gidx(){var t=document.getElementById("track");return t&&t.clientWidth?Math.round(t.scrollLeft/t.clientWidth):0}
function ggo(i){var t=document.getElementById("track");if(!t)return;var n=t.children.length;i=Math.max(0,Math.min(n-1,i));t.scrollTo({left:i*t.clientWidth,behavior:"smooth"})}
function gwire(start){var t=document.getElementById("track");if(!t)return;if(start)t.scrollLeft=start*t.clientWidth;t.addEventListener("scroll",function(){var c=document.getElementById("gcount");if(c)c.textContent=(gidx()+1)+" / "+t.children.length},{passive:true})}

   +field("p-exterior","Color exterior",P.exterior)+field("p-interior","Color interior",P.interior)+sel("p-puertas","Puertas",OPC.puertas,P.puertas,true)
   +sel("p-pasajeros","Pasajeros",OPC.pasajeros,P.pasajeros,true)+'</div>';
  h+='<div><p class="eyebrow" style="margin-bottom:8px">Accesorios</p><div class="chips">'+ACC.map(function(a,i){var on=P.acc.indexOf(a)>=0;return'<label class="chip'+(on?" on":"")+'"><input type="checkbox" id="acc-'+i+'" data-acc="'+esc(a)+'"'+(on?" checked":"")+'>'+esc(a)+'</label>'}).join("")+'</div></div>';
  h+='<div class="field"><label for="p-obs">Observaciones para el cliente</label><textarea id="p-obs" placeholder="Estado del vehículo, financiamiento, si recibes vehículo como inicial, etc.">'+esc(P.obs)+'</textarea></div></section>';
  h+=confirmDel?'<div class="confirm">¿Eliminar este vehículo, sus fotos y todos sus gastos? No se puede deshacer.<button class="btn" data-act="delyes">Sí, eliminar</button><button class="btn ghost" data-act="delno">Cancelar</button></div>':'<div><button class="btn ghost" data-act="delask">Eliminar vehículo</button></div>';
  return h;
}

var lastView="";
function render(keep){
  pendingRender=false;var r=route(),gi=keep?gidx():0;
  app.innerHTML=r.v==="panel"?panel():r.v==="veh"?vehView(r.id):r.v==="auto"?autoView(r.id):r.v==="entrar"?loginView():catalog();
  if(r.v==="veh")outs(r);
  gwire(gi);lastView=r.v+(r.id||"");
}
function setOut(k,t){app.querySelectorAll('[data-out="'+k+'"]').forEach(function(e){e.textContent=t})}
function outs(r){
  if(r.v==="veh"){var v=S.veh[r.id],c=calc(v),d="—";
    setOut("title",title(v));setOut("inv",money(c.inv));setOut("venta",c.sold?money(c.venta):d);setOut("gan",c.sold?money(c.gan):d);setOut("socio",c.sold?money(-c.socio):d);setOut("mio",c.sold?money(c.mio):d);
    var n=(v.gastos||[]).length;setOut("count",n+(n===1?" fila":" filas"));
  }else if(r.v==="panel"){var t=totals();setOut("t-inv",money(t.inv));setOut("t-venta",money(t.venta));setOut("t-gan",money(t.gan));setOut("t-socio",money(t.socio));setOut("t-mio",money(t.mio));setOut("t-name",S.cfg.socio||"socio")}
}
function typing(){var a=document.activeElement;return!!(a&&app.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=="file"&&a.type!=="checkbox")}
function soft(){var r=route();if(typing()){pendingRender=true;outs(r)}else render(true)}

/* ---------- eventos ---------- */
function newVeh(){
  var id=rid("v");
  S.veh[id]={marca:"",modelo:"",anio:"",vin:"",fecha:"",estado:"En subasta",venta:"",fotos:[],creado:Date.now(),pub:{on:false,moneda:"US$",unidad:"Mi",acc:[]},gastos:BASE.map(function(c){return{id:rid("g"),concepto:c,detalle:"",fecha:"",monto:""}})};
  save(id);confirmDel=false;location.hash=id;render();window.scrollTo(0,0);
  var m=document.getElementById("f-marca");if(m)m.focus();
}
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var act=b.getAttribute("data-act"),r=route();
  if(act==="gprev")return ggo(gidx()-1);
  if(act==="gnext")return ggo(gidx()+1);
  if(!admin)return;
  if(act==="new")return newVeh();
  if(act==="logout")return flushAll().then(function(){return post("logout",{})}).then(function(){location.hash="inicio";location.reload()},function(){setStatus("No se pudo cerrar la sesión. Inténtalo otra vez.",true)});
  if(r.v!=="veh")return;var id=r.id,v=S.veh[id];
  if(act==="addrow"){var g={id:rid("g"),concepto:"",detalle:"",fecha:"",monto:""};v.gastos=v.gastos||[];v.gastos.push(g);save(id);
    document.getElementById("rows").insertAdjacentHTML("beforeend",rowHtml(g));outs(r);var f=document.getElementById("g-"+g.id+"-concepto");if(f)f.focus()}
  else if(act==="delrow"){var gid=b.getAttribute("data-id");v.gastos=(v.gastos||[]).filter(function(x){return x.id!==gid});save(id);var rw=b.closest(".row");if(rw)rw.remove();outs(r)}
  else if(act==="fdel"){var i=gidx(),u=(v.fotos||[])[i];if(u){v.fotos.splice(i,1);save(id);post("fotoborrar",{url:u}).catch(function(){});render();gwire(Math.max(0,i-1))}}
  else if(act==="fcover"){var j=gidx();if(j>0&&v.fotos&&v.fotos[j]){v.fotos.unshift(v.fotos.splice(j,1)[0]);save(id);render();setStatus("Portada cambiada")}}
  else if(act==="delask"){confirmDel=true;render(true)}
  else if(act==="delno"){confirmDel=false;render(true)}
  else if(act==="delyes"){confirmDel=false;removeVeh(id);location.hash="panel";render();window.scrollTo(0,0)}
});
function onEdit(e){
  var t=e.target,r=route();
  if(t.id==="q"){var q=t.value.trim().toLowerCase(),n=0;app.querySelectorAll("#catcars .car").forEach(function(c){var ok=!q||c.getAttribute("data-s").indexOf(q)>=0;c.hidden=!ok;if(ok)n++});var nq=document.getElementById("noq");if(nq)nq.hidden=n>0;return}
  if(!admin)return;
  if(t.id&&t.id.indexOf("cfg-")===0){var k=t.id.slice(4);S.cfg[k]=k==="pct"?num(t.value):t.value;save("_cfg");outs(r);return}
  if(r.v!=="veh"||t.id==="f-foto")return;var id=r.id,v=S.veh[id];
  var row=t.closest("[data-row]");
  if(row){var g=(v.gastos||[]).filter(function(x){return x.id===row.getAttribute("data-row")})[0];if(g){g[t.getAttribute("data-k")]=t.value;save(id);outs(r)}return}
  if(t.hasAttribute("data-acc")){var P=pub(v),a=t.getAttribute("data-acc"),ix=P.acc.indexOf(a);if(t.checked&&ix<0)P.acc.push(a);if(!t.checked&&ix>=0)P.acc.splice(ix,1);t.parentNode.classList.toggle("on",t.checked);save(id);return}
  if(t.id==="p-on"){pub(v).on=t.checked;save(id);return}
  if(t.id&&t.id.indexOf("p-")===0){pub(v)[t.id.slice(2)]=t.value;save(id);return}
  if(t.id&&t.id.indexOf("f-")===0){v[t.id.slice(2)]=t.value;save(id);outs(r)}
}
app.addEventListener("input",onEdit);
app.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="f-foto"){var r=route();if(admin&&r.v==="veh"&&t.files&&t.files.length)addFotos(Array.prototype.slice.call(t.files),r.id);return}
  if(t.tagName==="SELECT")onEdit(e);
});
app.addEventListener("keydown",function(e){if(e.target.id!=="track")return;if(e.key==="ArrowLeft"){e.preventDefault();ggo(gidx()-1)}else if(e.key==="ArrowRight"){e.preventDefault();ggo(gidx()+1)}});
app.addEventListener("focusout",function(){setTimeout(function(){if(pendingRender&&!typing())render(true)},80)});
app.addEventListener("submit",function(e){
  if(e.target.id!=="login")return;e.preventDefault();if(loginBusy)return;
  var pw=document.getElementById("pw").value;loginBusy=true;loginErr="";render();
  post("login",{password:pw}).then(function(){loginBusy=false;return startAdmin()},function(err){loginBusy=false;loginErr=err&&err.status===401?"Contraseña incorrecta.":err&&err.code==="config"?"Falta definir la contraseña del panel en Vercel.":"No se pudo entrar. Inténtalo otra vez.";render();var p=document.getElementById("pw");if(p)p.focus()});
});
window.addEventListener("hashchange",function(){
  confirmDel=false;render();window.scrollTo(0,0);
  if(admin&&route().v==="cat")flushAll().then(loadCat).then(function(){if(route().v==="cat")render()});
});

function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),cv=document.createElement("canvas");
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){b?res(b):rej()},"image/jpeg",.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej()};
    img.src=url;
  });
}
function addFotos(files,id){
  var v=S.veh[id];if(!v)return;v.fotos=v.fotos||[];
  var room=MAXF-v.fotos.length,bad=0,up=0;
  if(room<=0){setStatus("Este vehículo ya tiene "+MAXF+" fotos. Quita una para agregar otra.",true);return}
  var extra=files.length>room;files=files.slice(0,room);setStatus("Subiendo fotos…");
  files.reduce(function(p,f,i){return p.then(function(){
    setStatus("Subiendo foto "+(i+1)+" de "+files.length+"…");
    return shrink(f).then(function(b){return api("foto",{method:"POST",headers:{"Content-Type":"image/jpeg"},body:b})}).then(function(j){if(S.veh[id]&&j.url){v.fotos.push(j.url);up++}},function(){bad++});
  })},Promise.resolve()).then(function(){
    if(up)save(id);
    if(route().id===id)render(true);
    if(bad)setStatus("No se pudo subir "+bad+(bad===1?" foto.":" fotos.")+" Revisa que el almacenamiento de fotos (Blob) esté conectado en Vercel.",true);
    else if(extra)setStatus("Se agregaron las primeras "+room+". El máximo es "+MAXF+" fotos por vehículo.");
  });
}

/* ---------- datos ---------- */
function startAdmin(){
  return api("data").then(function(d){
    S.cfg={socio:typeof d.cfg.socio==="string"?d.cfg.socio:DEF.socio,pct:d.cfg.pct==null?DEF.pct:num(d.cfg.pct),whatsapp:typeof d.cfg.whatsapp==="string"?d.cfg.whatsapp:""};
    S.veh=d.veh||{};admin=true;loginErr="";
    var h=location.hash;if(!h||h==="#"||h==="#entrar")location.hash="panel";
    render();
  },function(e){loginErr=e&&e.code==="config"?"Entraste, pero falta conectar la base de datos en Vercel.":"No se pudieron leer tus datos. Recarga la página.";render()});
}
render();
loadCat().then(function(){var v=route().v;if(v==="cat"||v==="auto")render()});
api("me").then(function(j){configurado=j.configurado!==false;if(j.admin)return startAdmin();if(route().v==="entrar")render()},function(){});
window.addEventListener("beforeunload",function(){Object.keys(dirty).forEach(function(id){if(dirty[id])flush(id)})});
})();
</script>
